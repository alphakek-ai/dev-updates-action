name: 'Dev Updates'
description: 'AI-powered dev update notifications with privacy modes and multi-channel dispatch'
author: 'alphakek-ai'

branding:
  icon: 'send'
  color: 'purple'

inputs:
  channels:
    description: 'YAML list of channel configurations'
    required: true
  state_branch:
    description: 'Dedicated initialized publication journal branch; never a source branch'
    default: 'dev-updates-state/default'
  cooldown:
    description: 'Minimum time between notifications (e.g., 6h, 1d, 30m). Empty = post on every push.'
    required: false
    default: ''
  community_rules:
    description: 'Instructions for community-facing summaries (user value, no internal details)'
    required: false
    default: |
      Audience: end users who do not know the codebase. Each bullet must answer
      "what can I now do, or what got better for me?" — lead with the user
      benefit, in plain language.

      Translate every change into user value. ("Upgraded to model X with
      speculative decoding" -> "AI responses are noticeably faster, especially
      on long answers.") If a change has no observable user impact, omit it or
      fold it into a single generic "behind-the-scenes improvements" bullet —
      do not pad the list with internal work.

      Do NOT name files, functions, libraries, model names, databases, or
      infrastructure. No version numbers, no product/tech brand names. If you
      catch yourself naming a technology, restate it as the benefit it delivers.
  dev_rules:
    description: 'Instructions for developer summaries (architecture & business logic)'
    required: false
    default: |
      Audience: the dev team. Explain HOW the system changed — the business
      logic, architecture, and data flow — not a file-by-file inventory.

      For each bullet, lead with the behavioral/structural change ("X now does Y
      instead of Z", "responsibility for X moved from A to B"), then cite the
      file/function/symbol as supporting evidence in parentheses or a trailing
      clause. Never make a filename or variable name the subject of a bullet.

      Group related file changes into one conceptual change. If five files moved
      because one component was replaced, that is ONE bullet about the component,
      not five about the files. Call out anything that changes contracts:
      breaking changes, migrations, new/removed env vars, API shape changes.
  title_style:
    description: 'Style for the update title'
    required: false
    default: 'catchy, under 40 chars'
  max_bullets:
    description: 'Maximum number of bullet points per summary'
    required: false
    default: '5'

runs:
  using: 'composite'
  steps:
    - name: Prepare publication
      id: range
      shell: bash
      env:
        CHANNELS: ${{ inputs.channels }}
        COOLDOWN: ${{ inputs.cooldown }}
        STATE_BRANCH: ${{ inputs.state_branch }}
        ACTION_PATH: ${{ github.action_path }}
        GH_TOKEN: ${{ github.token }}
      run: python3 "$ACTION_PATH/publication.py" prepare

    - name: Check required secrets
      if: steps.range.outputs.skip != 'true' && steps.range.outputs.resume != 'true'
      shell: bash
      run: |
        if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
          echo "::error::CLAUDE_CODE_OAUTH_TOKEN is not set. Add it as a repository secret."
          exit 1
        fi

    - name: Install uv
      if: steps.range.outputs.skip != 'true'
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      with:
        version: 0.12.1

    - name: Install locked delivery dependencies
      if: steps.range.outputs.skip != 'true'
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: |
        uv --no-config venv --python "$(command -v python3)" "$RUNNER_TEMP/dev-updates-venv"
        uv --no-config pip sync --python "$RUNNER_TEMP/dev-updates-venv/bin/python" --require-hashes "$ACTION_PATH/requirements.txt"

    - name: Generate summaries
      if: steps.range.outputs.skip != 'true' && steps.range.outputs.resume != 'true'
      shell: bash
      env:
        GH_TOKEN: ''
        GITHUB_TOKEN: ''
        HAS_DEV: ${{ steps.range.outputs.has_dev }}
        HAS_COMMUNITY: ${{ steps.range.outputs.has_community }}
        BEFORE: ${{ steps.range.outputs.before }}
        AFTER: ${{ steps.range.outputs.after }}
        DEV_RULES: ${{ inputs.dev_rules }}
        COMMUNITY_RULES: ${{ inputs.community_rules }}
        TITLE_STYLE: ${{ inputs.title_style }}
        MAX_BULLETS: ${{ inputs.max_bullets }}
        ACTION_PATH: ${{ github.action_path }}
      run: python3 "$ACTION_PATH/summarize.py"

    - name: Publish journaled batch
      if: steps.range.outputs.skip != 'true'
      shell: bash
      env:
        CHANNELS: ${{ inputs.channels }}
        STATE_BRANCH: ${{ inputs.state_branch }}
        BEFORE: ${{ steps.range.outputs.before }}
        AFTER: ${{ steps.range.outputs.after }}
        ACTION_PATH: ${{ github.action_path }}
        GH_TOKEN: ${{ github.token }}
      run: '"$RUNNER_TEMP/dev-updates-venv/bin/python" "$ACTION_PATH/publication.py" publish'
